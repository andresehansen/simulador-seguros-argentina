name: Despliegue Continuo Sitio Estático $0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependencias
        run: npm ci

      - name: Compilar y Exportar Sitio Estático (SSG)
        run: npm run build

      - name: Subir Artefacto Estático para Despliegue
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
